name: Build External Plugins

on:
  push:
    branches: [main, master]
    paths:
      - 'plugins-external/**'
      - '.github/workflows/plugins-release.yml'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Specific plugin to build (empty = all)'
        required: false
        type: string

jobs:
  list-plugins:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.set.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List plugin directories
        id: set
        env:
          REQUESTED_PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          dirs=()
          for d in plugins-external/*/; do
            name=$(basename "$d")
            if [ -f "$d/main.go" ] && { [ -z "$REQUESTED_PLUGIN" ] || [ "$name" = "$REQUESTED_PLUGIN" ]; }; then
              dirs+=("$d")
            fi
          done
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No plugins match the requested filter" >&2
            exit 1
          else
            echo "dirs=$(printf '%s\n' "${dirs[@]}" | jq -R . | jq -s -c .)" >> $GITHUB_OUTPUT
          fi

  build-plugins:
    needs: list-plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin-dir: ${{ fromJson(needs.list-plugins.outputs.dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Setup PaperValet (for replace directive)
        run: |
          git clone --depth 1 https://github.com/PaperValet/PaperValet "$GITHUB_WORKSPACE/../PaperValet"

      - name: Extract plugin name
        id: meta
        run: |
          name=$(basename "${{ matrix.plugin-dir }}")
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Build plugin
        working-directory: ${{ matrix.plugin-dir }}
        run: |
          go test ./...
          go vet ./...
          go build -buildmode=plugin -o ../../${{ steps.meta.outputs.name }}.so .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ steps.meta.outputs.name }}
          if-no-files-found: error
          path: ${{ steps.meta.outputs.name }}.so

  release:
    needs: build-plugins
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.plugin == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'plugin-*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Latest External Plugins'
          body: |
            Auto-built external plugins for PaperValet.
            Install with: `apt install <plugin-name>`
          files: artifacts/**/*.so
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
