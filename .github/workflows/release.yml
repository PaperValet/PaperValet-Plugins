name: Build and Release External Plugins

on:
  push:
    tags:
      - 'plugins/**'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to build (or "all")'
        required: true
        default: 'all'

jobs:
  build-plugin:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ping
          - leech
          - qrcode
          - bf
          - re
          - sendlog
          - tpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download PaperValet dependency
        run: |
          cd plugins-external/${{ matrix.plugin }}
          go mod tidy
          go build -buildmode=plugin -o /tmp/${{ matrix.plugin }}.so .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-plugin
          path: /tmp/${{ matrix.plugin }}.so
          retention-days: 30

  release:
    needs: build-plugin
    if: startsWith(github.ref, 'refs/tags/plugins/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.so
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}